<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>آلة حاسبة</title>
<style>
  :root{--bg:#f0f1f3;--card:#fafafb;--ink:#2b2f36;--mute:#7b818a;--line:#d9dce1;--acc:#5b6573;--key:#e4e6ea;--key2:#d3d7dd;--sel:#e6e9ee;--blk:#0d0f12;--res:#7d838c}
  @media (prefers-color-scheme:dark){:root{--bg:#1f2023;--card:#2a2b2f;--ink:#e8eaed;--mute:#9199a3;--line:#3a3c41;--acc:#a3adbb;--key:#34363b;--key2:#41444a;--sel:#363a41;--blk:#f4f5f7;--res:#9aa1ab}}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
  body{position:fixed;inset:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center}
  .calc{position:relative;width:100%;max-width:480px;background:var(--card);display:flex;flex-direction:column;overflow:hidden;height:100vh;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  @media (min-width:520px){body{padding:12px}.calc{height:calc(100dvh - 24px);border:1px solid var(--line);border-radius:20px;padding:0}}
  .bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
  .bar .st{flex:1;min-width:0;font-size:11px;color:var(--mute);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar button{font-size:13px;padding:7px 9px;border-radius:10px;white-space:nowrap}
  .pv{border:1px solid var(--line);border-radius:12px;padding:6px 10px;margin-bottom:10px;direction:ltr;font-variant-numeric:tabular-nums}
  .pv div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:17px}
  .pv div:last-child{border:0}
  .pv .tt{font-weight:700;color:var(--acc);font-size:19px}
  .bar button.main{background:var(--acc);color:#fff}
  .ttl{flex:none;margin:2px 12px 0;font-size:15px;font-weight:700;color:var(--acc);text-align:center;direction:rtl;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .md{flex:none;display:flex;gap:4px}
  .md button{font-size:13px;padding:0 9px;border-radius:8px;width:auto;background:var(--key)}
  .md button.on{background:var(--acc);color:#fff}
  .item .ti{font-size:16px;font-weight:700;color:var(--ink)}
  .tape{flex:1;min-height:0;overflow-y:auto;padding:10px 14px 8px;direction:ltr;font-variant-numeric:tabular-nums}
  .hint{color:var(--mute);text-align:center;direction:rtl;margin:6px 0 10px;font-size:13px;line-height:1.8}
  .row{display:flex;justify-content:space-between;gap:12px;padding:9px 8px;border-bottom:1px dashed var(--line);font-size:18px;min-height:44px;align-items:baseline;cursor:pointer;border-radius:8px}
  .row .ex{color:var(--blk);text-align:left;word-break:break-all}
  .row .re{color:var(--res);font-weight:600;text-align:right;white-space:nowrap}
  .row.sel{background:var(--sel);border-bottom:2px solid var(--acc);font-size:22px}
  .row.sel .ex{color:var(--blk)}
  .row.sel .re{color:var(--res)}
  .nbar{padding:6px 12px 8px;flex:none}
  .nbar{display:flex;gap:8px;align-items:stretch;direction:ltr}
  #mic{flex:none;width:44px;font-size:20px;padding:0;border-radius:10px;background:var(--key)}
  #mic.on{background:#e03131;color:#fff;animation:mp 1s infinite}
  @keyframes mp{50%{opacity:.55}}
  .nbar input{flex:1;min-width:0;width:auto;font:inherit;font-size:15px;padding:5px 10px;border-radius:10px;border:1px solid var(--line);background:var(--key);color:var(--ink);direction:rtl}
  .row .nt{flex:1;text-align:center;color:var(--acc);font-size:14px;direction:rtl;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .total{margin:0 14px;padding:4px 4px 2px;border-top:2px solid var(--line);flex:none}
  .sum2{display:flex;gap:8px;direction:ltr;align-items:stretch}
  .sum2 .box{min-width:0;border-radius:11px;padding:1px 10px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.16)}
  .sum2 .box b{font-weight:900;line-height:1.2;font-variant-numeric:tabular-nums;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sum2 .red{flex:1;background:linear-gradient(135deg,#e03131,#b02525)}
  .sum2 .red b{font-size:26px}
  .sum2 .green{cursor:pointer;flex:none;font-size:15px;min-width:calc(3ch + 20px);padding:1px 8px;background:linear-gradient(135deg,#2f9e44,#1f7a33)}
  .sum2 .green b{font-size:15px;font-weight:800}
  .sum{display:flex;justify-content:space-between;align-items:center;direction:rtl}
  .sum span{color:var(--mute);font-size:15px}
  .sum b{direction:ltr;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;color:#2f9e44}
  .sum b span{font-size:inherit;font-weight:inherit;color:inherit}
  .sum small{font-size:16px;font-weight:600;color:var(--mute);cursor:pointer}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 12px 10px;direction:ltr;flex:none}
  .keys button{height:clamp(38px,6.6dvh,58px);padding:0}
  .tape{display:grid;direction:ltr;column-gap:16px;align-content:start;grid-auto-flow:column;overflow-y:auto}
  .row{direction:ltr;font-size:var(--f,22px);height:var(--rh,46px);min-height:0;padding:0 6px;align-items:center;gap:6px}
  .row.sel{font-size:var(--f,22px);font-weight:600}
  .row .ex{display:inline-flex;white-space:nowrap;min-width:0;direction:ltr}
  .row .ex .tk.fxg{color:#2f9e44;font-weight:800}
  .row .ex .tk{display:inline-block;unicode-bidi:isolate}
  .row .re{flex:none}
  .tape.ar .row{direction:rtl}
  .tape.ar .ex{display:inline-flex;direction:rtl;gap:.12em;text-align:right}
  .row .lh{display:flex;align-items:center;gap:6px;min-width:0;flex:none}
  .row .nt{flex:1 1 0;min-width:0}
  .row .bd{flex:none;min-width:1.7em;height:1.7em;padding:0 .3em;box-sizing:border-box;border-radius:.45em;background:var(--key2);color:var(--ink);font-size:calc(var(--f,22px)*.62);font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
  .row.sel .bd{background:var(--acc);color:#fff}
  .row .nt{min-width:0}
  .tabs{display:flex;gap:6px;padding:6px 12px 4px;border-top:1px solid var(--line);flex:none}
  .tab{flex:1;height:auto;padding:6px 4px;font-size:16px;line-height:1.25;border-radius:12px;display:flex;flex-direction:column;align-items:center;border:2px solid transparent}
  .tab b{font-weight:700}
  .tab small{font-size:11px;color:var(--mute);font-weight:400}
  .tab.on{border-color:var(--acc);background:var(--sel)}
  .nbar input::placeholder,#talkTa::placeholder{color:var(--mute);opacity:.6}
  .tnote{font-size:12px;color:var(--mute);min-height:0;line-height:1.5}
  button{font:inherit;font-size:22px;padding:12px 0;border:0;border-radius:14px;background:var(--key);color:var(--ink);cursor:pointer}
  button:active{background:var(--key2)}
  .keys button.plus{display:flex;align-items:center;justify-content:center;color:var(--acc);background:var(--key2);box-shadow:inset 0 0 0 2px var(--acc)}
  button.op{color:var(--acc);font-weight:700}
  button.eq{background:linear-gradient(145deg,#ff9f7e,#f97746);color:#fff;display:flex;align-items:center;justify-content:center}
  button.fn{font-size:20px}
  .ov{position:absolute;inset:0;background:var(--card);display:flex;flex-direction:column;z-index:5}
  .ov h2{margin:0;font-size:16px;flex:1}
  .ovh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .bk{background:var(--acc)!important;color:#fff!important;font-weight:700;font-size:15px;padding:8px 16px;width:auto;border-radius:20px;box-shadow:0 2px 6px rgba(0,0,0,.18);white-space:nowrap}
  .ovb{flex:1;overflow-y:auto;padding:12px 14px}

  .bar .stc{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .bar .stc .st{flex:none;width:100%;text-align:center;line-height:13px}
  .logo{position:relative;height:17px;width:100%;pointer-events:none;flex:none;display:flex;align-items:center;justify-content:center}
  .logo .lgi{height:15px;width:auto;display:block;opacity:.8;animation:beat 2s ease-in-out infinite;transform-origin:center}
  @keyframes beat{0%{transform:scale(1);opacity:.78}9%{transform:scale(1.14);opacity:1}19%{transform:scale(1);opacity:.82}29%{transform:scale(1.08);opacity:.95}42%,100%{transform:scale(1);opacity:.78}}
  @media (prefers-reduced-motion:reduce){.logo .lgi{animation:none}}
  .seg{display:flex;gap:6px;margin-bottom:10px}
  .ovb .seg button{margin:0;font-size:15px;padding:10px 6px;background:var(--key)}
  .ovb .seg button.on{background:var(--acc);color:#fff}
  .ovb input.nm{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--key);color:var(--ink);direction:rtl;margin-bottom:10px}
  .ovb button.df{display:flex;justify-content:space-between;align-items:center;text-align:right;background:var(--key);font-size:15px;padding:11px 14px;margin-bottom:8px}
  .df span{color:var(--mute);font-size:13px;white-space:nowrap;margin-inline-end:10px}
  .df b{font-size:15px;flex:1;text-align:left;direction:rtl}
  .ares{border:1px solid var(--line);border-radius:12px;margin:10px 0}
  .ares .ar{padding:9px 14px;border-bottom:1px solid var(--line)}
  .ares .ar:last-child{border-bottom:0}
  .ares .al{font-size:12px;color:var(--mute)}
  .ares .av{font-size:16px;font-weight:700;color:var(--blk)}
  .cvrow{position:relative;display:flex;gap:3px;margin-bottom:10px}
  .ovb button.cvc{display:flex;align-items:center;gap:14px;text-align:right;background:var(--key);padding:15px 16px;margin-bottom:10px;border-radius:14px;font-size:18px;font-weight:700}
  .ovb .cvrow button.cvc{flex:1;flex-direction:column;justify-content:center;text-align:center;gap:6px;margin:0;padding:16px 8px;font-size:17px}
  .ovb .cvrow button.cvc:first-child{border-radius:0 14px 14px 0}
  .ovb .cvrow button.cvc:last-child{border-radius:14px 0 0 14px}
  .cvj{position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--card);pointer-events:none;z-index:2}
  .cvj:before{content:"";position:absolute;left:7px;top:7px;width:8px;height:8px;background:#fff;border-radius:50%}
  .cvc small{display:block;color:var(--mute);font-size:12px;font-weight:400;margin-top:2px}
  .ovb input.fxa{font-size:24px;font-weight:700;text-align:center;direction:ltr;margin-bottom:8px;padding:8px 12px}
  .fxw{position:relative}
  .ovb .fxw button.df{margin-bottom:6px;padding:9px 14px}
  .fxw .df b{text-align:right;margin-inline-start:6px}
  .ovb button.fxs{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:2;display:flex;align-items:center;justify-content:center;margin:0;width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;font-size:22px;padding:0;box-shadow:0 0 0 4px var(--card)}
  .fxres{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
  .fxres .big{font-size:24px;font-weight:700;color:var(--blk)}
  .fxres .sm{font-size:13px;color:var(--mute);margin-top:4px}
  .fxres .sm.ltr{direction:ltr;text-align:right}
  .fxw2{margin-top:8px;padding:8px 10px;border-radius:10px;background:#fff4d6;color:#7a5200;font-size:13px;line-height:1.6}
  .fxn{font-size:12px;color:var(--mute);line-height:1.6;margin:8px 2px}
  .fxn a{color:var(--mute)}
  .cpv{position:absolute;inset:0;z-index:30;background:var(--card);display:flex;flex-direction:column;direction:rtl}
  .cph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
  .cph input{flex:1;min-width:0;box-sizing:border-box;font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--key);color:var(--ink);direction:rtl}
  .cph button.bk{padding:10px 16px}
  .cpl{flex:1;overflow-y:auto;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;align-content:start}
  .cpi{display:block;padding:7px 8px;border:1px solid var(--line);border-radius:10px;font-size:13px;cursor:pointer;line-height:1.35}
  .cpi span{display:block;color:var(--mute);font-size:11px;direction:ltr;text-align:right}
  .cpi.on{color:var(--acc);font-weight:700}
  .dpv{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
  .dps{width:100%;background:var(--card);border-radius:20px 20px 0 0;padding:14px 14px 16px;direction:rtl}
  .dph{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .dph label{display:flex;align-items:center;gap:6px;font-size:17px;cursor:pointer}
  .dph .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);box-sizing:border-box;display:inline-block}
  .dph .rd.on{border:6px solid var(--acc)}
  .dph button{margin-inline-start:auto;font-size:15px;padding:8px 18px;width:auto}
  .dpw{position:relative;display:flex;direction:rtl;height:210px;margin:6px 0 10px}
  .dpw:before{content:"";position:absolute;left:0;right:0;top:84px;height:42px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);pointer-events:none}
  .whl{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;padding:84px 0;scrollbar-width:none;text-align:center;-webkit-overflow-scrolling:touch}
  .whl::-webkit-scrollbar{display:none}
  .wi{height:42px;line-height:42px;font-size:19px;scroll-snap-align:center;color:var(--mute);cursor:pointer}
  .wi.on{color:var(--blk);font-weight:700;font-size:21px}
  .dpb{display:flex;gap:8px}
  .dpb button{flex:1;font-size:17px;padding:12px}
  .ovb button{display:block;width:100%;margin-bottom:10px;font-size:17px;padding:14px}
  .ovb button.main{background:var(--acc);color:#fff}
  .item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;gap:10px;align-items:center;cursor:pointer}
  .item .m{flex:1;min-width:0}
  .item .d{font-size:12px;color:var(--mute)}
  .item .t{font-size:20px;font-weight:700;color:var(--acc);direction:ltr;text-align:right}
  .item .l{font-size:13px;color:var(--mute);direction:ltr;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .x{font-size:13px;padding:6px 10px;border-radius:8px;width:auto;margin:0}
  .item .x.sure{background:#b91c1c;color:#fff}
  textarea{width:100%;height:200px;font:inherit;font-size:16px;direction:rtl;background:var(--key);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
  .ovb img{width:100%;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#fffdf8}
  .note{font-size:13px;color:var(--mute);margin:0 0 10px;line-height:1.7}
  a.btn{display:block;text-align:center;padding:14px;border-radius:14px;background:var(--key);color:var(--ink);text-decoration:none;font-size:17px;margin-bottom:10px}
</style>

<script>
const calcEl=document.getElementById('calc'),tape=document.getElementById('tape'),sumEl=document.getElementById('sum'),stEl=document.getElementById('st');
const OPS='+-×÷';
// تحويل الأرقام العربية والفارسية إلى إنجليزية تلقائيًا
function toEn(s){return s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫]/g,'.')}
function fixInput(el){const v=toEn(el.value);if(v!==el.value){const p=el.selectionStart;el.value=v;try{el.setSelectionRange(p,p)}catch(e){}}}
const KEY='calc_sheets_v1';
let S={sheets:[{id:Date.now(),lines:[''],ts:Date.now()}],cur:0,trash:[]};
const TRASH_MS=60*60*1000;
function purgeTrash(){const n=S.trash.length,now=Date.now();S.trash=S.trash.filter(t=>now-t.del<TRASH_MS);return n!==S.trash.length}
const shJson=s=>({id:s.id,ts:s.ts,title:s.title||'',lines:s.lines,notes:s.notes||[]});
let lines=S.sheets[0].lines,idx=0;
const noteEl=document.getElementById('note');
function N(){const sh=S.sheets[S.cur];if(!sh.notes)sh.notes=[];while(sh.notes.length<lines.length)sh.notes.push('');sh.notes.length=lines.length;return sh.notes}

/* ---------- الحساب ---------- */
const numAr=false;
let RTL=true;try{RTL=localStorage.getItem('calc_rtl')!=='0'}catch(e){} // اتجاه الصفحة: يمين أو يسار
function D(s){s=String(s);return numAr?s.replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace(/\./g,'٫'):s}
function fmt(n){return D(String(+n.toFixed(10)))}
function evalExpr(s){
  const t=s.match(/\d*\.?\d+|[+\-×÷]/g);if(!t||t.join('')!==s)return null;
  let i=0;
  const num=()=>{let sign=1;while(t[i]==='-'||t[i]==='+'){if(t[i]==='-')sign=-sign;i++}if(i>=t.length||OPS.includes(t[i]))throw 0;return sign*parseFloat(t[i++])};
  const term=()=>{let v=num();while(t[i]==='×'||t[i]==='÷'){const o=t[i++],r=num();if(o==='÷'&&r===0)throw 1;v=o==='×'?v*r:v/r}return v};
  try{let v=term();while(t[i]==='+'||t[i]==='-'){const o=t[i++],r=term();v=o==='+'?v+r:v-r}if(i<t.length)return null;return v}catch(e){return e===1?'div':null}
}
function val(expr){
  const s=expr.replace(/[+\-×÷.]+$/,'');
  if(!s)return null;
  const v=evalExpr(s);
  return (typeof v==='number'&&!isFinite(v))?null:v;
}
function sheetTotal(ls){let t=0;ls.forEach(e=>{const v=val(e);if(typeof v==='number')t+=v});return t}
function isEmpty(sh){return sh.lines.every(e=>!e)}
const disp=e=>{const t=D(e.replace(/-/g,'−'));return numAr?'\u202D'+t+'\u202C':t};
// في الشاشة: كل رقم وعلامة في خانة مستقلة بالترتيب الحقيقي، فلا ينقلب ترتيبها أبدًا
function exNode(e,fx){
  const a=document.createElement('span');a.className='ex';
  let acc=0;const g=fx&&e.startsWith(fx);
  (e.match(/\d+\.?\d*|\.\d+|[+\-×÷]/g)||[]).forEach(t=>{const x=document.createElement('span');x.className='tk'+(g&&acc<fx.length?' fxg':'');acc+=t.length;x.textContent=D(t==='-'?'−':t);a.appendChild(x)});
  return a
}

/* ---------- الأزرار ---------- */
const layout=[['C','fn'],['⌫','fn'],['÷','op'],['×','op'],['7'],['8'],['9'],['-','op'],['4'],['5'],['6'],['+','op'],['1'],['2'],['3'],['↑','eq'],['0'],['.'],['00'],['↵','eq']];
const kb=document.getElementById('keys');
const SV=p=>'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="'+p+'"/></svg>';
const UP=SV('M12 19V5M5 12l7-7 7 7'),DOWN=SV('M12 5v14M5 12l7 7 7-7');
layout.forEach(([k,c])=>{const b=document.createElement('button');b.className=c||'';
  if(k==='↑')b.innerHTML=UP;else if(k==='↵')b.innerHTML=DOWN;else if(k==='+')b.innerHTML='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4.2" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>';else{b.textContent=k==='-'?'−':k;if(/^[0-9.]+$/.test(k))b.dataset.l=k}
  if(k==='+')b.classList.add('plus');
  b.onclick=()=>press(k);kb.appendChild(b)});

function press(k){
  let e=lines[idx];
  if(k==='C'){lines.splice(0,lines.length,'');idx=0;N().fill('');S.sheets[S.cur].fx={}}
  else if(k==='↑'){if(idx>0)idx--}
  else if(k==='↵'){
    if(idx<lines.length-1)idx++;
    else if(typeof val(e)==='number'){lines.push('');idx++}
  }
  else if(k==='⌫'){
    if(e)lines[idx]=e.slice(0,-1);
    else if(lines.length>1){S.sheets[S.cur].fx={};N().splice(idx,1);lines.splice(idx,1);if(idx>=lines.length)idx=lines.length-1;else if(idx>0)idx--}
  }
  else if(OPS.includes(k)){
    if(!e&&k!=='-')return;
    if(/[+\-×÷]$/.test(e)&&e.length>1)e=e.slice(0,-1);
    lines[idx]=e+k
  }else if(k==='.'){
    const last=e.split(/[+\-×÷]/).pop();
    if(last.includes('.'))return;
    lines[idx]=e+(last===''?'0.':'.')
  }else lines[idx]=e+k;
  render();queueSave()
}
function layoutTape(){
  const cs=getComputedStyle(tape);
  const H=tape.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(H<=0)return;
  const n=Math.max(lines.length,1),RH=f=>Math.round(f*2.1);
  const opts=[];[22,20,18,16,15,14].forEach(f=>opts.push([1,f]));[17,15,14,13,12].forEach(f=>opts.push([2,f]));[14,13,12,11,10].forEach(f=>opts.push([3,f]));
  let best=null;
  for(const [c,f] of opts){if(Math.ceil(n/c)*RH(f)<=H){best=[c,f];break}}
  if(!best){const R=Math.ceil(n/3);best=[3,Math.max(8,Math.floor(H/R/2.1))]}
  const [c,f]=best,R=Math.ceil(n/c);
  tape.style.setProperty('--f',f+'px');tape.style.setProperty('--rh',RH(f)+'px');
  tape.style.gridTemplateColumns='repeat('+c+',minmax(0,1fr))';
  tape.style.gridTemplateRows='repeat('+R+','+RH(f)+'px)';
}
if(window.ResizeObserver)new ResizeObserver(()=>layoutTape()).observe(tape);
let mode='d';

/* ---------- الحفظ التلقائي ---------- */
let dbDoc=null,saveT=null;
function snapshot(){
  S.sheets=S.sheets.filter((sh,i)=>i===S.cur||!isEmpty(sh)); // احذف الأوراق الفارغة
  S.cur=S.sheets.findIndex(sh=>sh.lines===lines);
  purgeTrash();
  return JSON.stringify({ts:Date.now(),cur:S.cur,sheets:S.sheets.map(shJson),trash:S.trash.map(t=>({del:t.del,sh:shJson(t.sh)}))})
}
function queueSave(){
  S.sheets[S.cur].ts=Date.now();
  stEl.textContent='جارٍ الحفظ…';
  clearTimeout(saveT);saveT=setTimeout(doSave,350)
}
async function doSave(){
  const json=snapshot();
  try{localStorage.setItem(KEY,json)}catch(e){}
  let ok=false;
  try{localStorage.getItem(KEY)===json&&(ok=true)}catch(e){}
  if(dbDoc){try{await dbDoc.set({json,ts:Date.now()});ok=true}catch(e){}}
  stEl.textContent=ok?'تم الحفظ ✓':'لم يُحفظ'
}
function applyData(json){
  try{
    const d=JSON.parse(json);
    if(!d||!Array.isArray(d.sheets)||!d.sheets.length)return false;
    S.sheets=d.sheets.map(s=>({id:s.id,ts:s.ts,title:String(s.title||''),lines:Array.isArray(s.lines)&&s.lines.length?s.lines.map(String):[''],notes:Array.isArray(s.notes)?s.notes.map(String):[]}));
    S.trash=(Array.isArray(d.trash)?d.trash:[]).filter(t=>t&&t.sh&&Array.isArray(t.sh.lines)).map(t=>({del:+t.del||0,sh:{id:t.sh.id,ts:t.sh.ts,title:String(t.sh.title||''),lines:t.sh.lines.map(String),notes:Array.isArray(t.sh.notes)?t.sh.notes.map(String):[]}}));
    purgeTrash();
    S.cur=Math.min(Math.max(d.cur|0,0),S.sheets.length-1);
    lines=S.sheets[S.cur].lines;idx=lines.length-1;
    return true
  }catch(e){return false}
}
let localJson=null;
try{localJson=localStorage.getItem(KEY)}catch(e){}
if(localJson)applyData(localJson);
(async()=>{
  try{
    const user=await claude.use('user'),db=await claude.use('db');
    if(!user||!db)return;
    const id=await user.id();
    dbDoc=db.collection('data/users/'+id).doc('calc');

    const data=snap&&(typeof snap.data==='function'?snap.data():snap);
    if(data&&data.json){

      if((data.ts||0)>localTs&&applyData(data.json)){render();stEl.textContent='تم الحفظ ✓'}
    }
    doSave()
  }catch(e){}
})();

function makePNG(){
  const rows=[];
  lines.forEach((e,i)=>{const v=val(e);if(typeof v==='number')rows.push({n:D(rows.length+1),raw:e.replace(/[+\-×÷.]+$/,''),res:fmt(v),nt:N()[i]||''})});
  const W=720,pad=40,head=100,foot=150,hasNt=rows.some(r=>r.nt),rh=hasNt?100:70,H=head+rows.length*rh+foot;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d'),F='system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif';
  x.fillStyle='#fafafb';x.fillRect(0,0,W,H);
  x.textBaseline='middle';
  const title=(S.sheets[S.cur].title||'').trim()||'آلة حاسبة';
  const sideS=RTL?W-pad:pad,sideE=RTL?pad:W-pad;
  x.direction='rtl';x.textAlign='center';x.fillStyle='#111';x.font='bold 36px '+F;x.fillText(title,W/2,40,W-2*pad);
  x.direction='ltr';x.textAlign='center';x.fillStyle='#8a8f97';x.font='21px '+F;
  x.fillText(new Date().toLocaleDateString('en-GB'),W/2,76);
  // خطوط خفيفة مثل الدفتر: كل سطر داخل خانته
  x.strokeStyle='#d3d8df';x.lineWidth=2;x.setLineDash([]);
  for(let i=0;i<=rows.length;i++){const y=head+i*rh;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}
  const GAP=14;
  rows.forEach((r,i)=>{
    const y0=head+i*rh,yy=hasNt?y0+68:y0+rh/2;
    if(r.nt){x.direction='rtl';x.textAlign=RTL?'right':'left';x.fillStyle='#333';x.font='600 25px '+F;x.fillText(r.nt,sideS,y0+26,W-2*pad)}
    const T=[[r.n,'600 32px '+F,'#111'],['-','32px '+F,'#9aa0a8']];
    (r.raw.match(/\d+\.?\d*|\.\d+|[+\-×÷]/g)||[]).forEach(t=>T.push([D(t==='-'?'−':t),'32px '+F,'#111']));
    T.push(['=','32px '+F,'#111'],[r.res,'bold 38px '+F,'#111']);
    x.direction='ltr';x.textAlign=RTL?'right':'left';
    let px=sideS;
    T.forEach(([t,f,col])=>{x.font=f;x.fillStyle=col;x.fillText(t,px,yy);const w=x.measureText(t).width+GAP;px+=RTL?-w:w})
  });
  const ty=head+rows.length*rh;
  x.strokeStyle='#111';x.lineWidth=3;x.beginPath();x.moveTo(pad,ty+14);x.lineTo(W-pad,ty+14);x.stroke();
  x.direction='rtl';x.textAlign=RTL?'right':'left';x.fillStyle='#8a8f97';x.font='28px '+F;x.fillText('المجموع',sideS,ty+80);
  const lw=x.measureText('المجموع').width+26;
  x.direction='ltr';x.textAlign=RTL?'right':'left';x.fillStyle='#111';x.font='bold 64px '+F;x.fillText(fmt(sheetTotal(lines)),RTL?sideS-lw:sideS+lw,ty+80);
  return c
}
function openPNG(){shareSheet(makePNG(),buildText())}
function shareSheet(c,text){
  const {ov,b}=overlay('إرسال');
  const img=document.createElement('img');img.src=c.toDataURL('image/png');
  const msg=document.createElement('p');msg.className='note';
  const mkFile=()=>new Promise(r=>c.toBlob(bl=>r(bl),'image/png'));
  const fname='calc-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.png';
  const save=btn('💾  حفظ في الاستوديو',async()=>{
    const blob=await mkFile();
    try{
      if(typeof claude!=='undefined'){const dl=await claude.use('downloads');if(dl){await dl.save({filename:fname,data:blob});msg.textContent='تم الحفظ ✓';return}}
    }catch(e){}
    try{
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();
      msg.textContent='تم الحفظ ✓ تجدها في الاستوديو داخل ألبوم التنزيلات (Download).'
    }catch(e){msg.textContent='لم يتم الحفظ. اضغط مطولًا على الصورة لحفظها.'}
  },true);
  const wa=btn('🟢  إرسال واتساب (صورة)',async()=>{
    const blob=await mkFile(),f=new File([blob],fname,{type:'image/png'});
    try{
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
    }catch(e){if(e&&e.name==='AbortError')return}
    msg.textContent='مشاركة الصورة غير متاحة هنا. احفظها ثم أرسلها من الاستوديو.'
  });
  const wt=btn('📝  إرسال واتساب (رسالة نص)',async()=>{
    try{await navigator.clipboard.writeText(text)}catch(e){}
    const a=document.createElement('a');a.href='https://wa.me/?text='+encodeURIComponent(text);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    msg.textContent='نُسخت الرسالة وفُتح واتساب. اختر الشخص، وإن لم تظهر الرسالة فالصقها.'
  });
  b.append(save,wa,wt,msg,img);
}

})();
function nwLookup(t){return Object.prototype.hasOwnProperty.call(NWORDS,t)?NWORDS[t]:null}
function nwInfo(t){
  let i=nwLookup(t);if(i)return {i,conn:false};
  if(t.length>1&&t[0]==='و'){i=nwLookup(t.slice(1));if(i)return {i,conn:true}}
  return null
}
const OPW={'+':['زايد','زياده','جمع','بلس','plus'],'-':['ناقص','طرح','خصم','minus'],'×':['ضرب','في','مضروب','مضروبه','ضربنا','x'],'÷':['قسمه','تقسيم','قسم','علي']};
const OPMAP={};for(const o in OPW)OPW[o].forEach(w=>OPMAP[w]=o);
const UNITS=new Set(['ريال','ريالات','ريالا','هلله','هللات','دينار','دولار','درهم','جنيه','sar','sr','رس']);
const BYW=new Set(['ب','بسعر','بمبلغ','بقيمه']);
const fmtN=v=>String(+(+v).toFixed(10));
function tokenize(raw){
  let s=raw.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/(\d)[,٬](?=\d{3}(\D|$))/g,'$1');
  s=nz(s);
  s=s.replace(/(\d+(?:\.\d+)?)/g,' $1 ').replace(/([+×÷*\/-])/g,' $1 ');
  s=s.replace(/(?<!\d)\.|\.(?!\d)|[،؛,!؟?\n]/g,' | ');
  const ws=s.split(/\s+/).filter(Boolean),T=[];
  for(let i=0;i<ws.length;i++){
    const w=ws[i];
    if(w==='|'){T.push({t:'brk'});continue}
    if(/^\d+(\.\d+)?$/.test(w)){T.push({t:'num',v:parseFloat(w)});continue}
    if(w==='*'){T.push({t:'op',o:'×'});continue}
    if(w==='/'){T.push({t:'op',o:'÷'});continue}
    if(w==='+'||w==='-'||w==='×'||w==='÷'){T.push({t:'op',o:w});continue}
    let info=nwInfo(w),pre=false;
    if(!info&&w.length>1&&w[0]==='ب'&&nwInfo(w.slice(1))){T.push({t:'by'});info=nwInfo(w.slice(1));pre=true}
    if(info&&!(info.i.kind==='f')){
      // اجمع كلمات الرقم المتتالية (خمسة وعشرين، ثلاثة آلاف ومئتين…)
      let total=0,cur=0,lastUnit=0,has=false,j=i;
      const take=(inf)=>{
        const {kind,v}=inf;
        if(kind==='n'){cur+=v;lastUnit=(v>=1&&v<=9)?v:0}
        else if(kind==='h'){if(lastUnit){cur=cur-lastUnit+lastUnit*100}else cur+=100;lastUnit=0}
        else if(kind==='t'){total+=(cur||1)*1000;cur=0;lastUnit=0}
        else if(kind==='f'){cur+=v;lastUnit=0}
        has=true
      };
      take(info.i);
      while(j+1<ws.length){
        let nx=ws[j+1],step=1,conn=false;
        if(nx==='و'&&j+2<ws.length){conn=true;nx=ws[j+2];step=2}
        const ni=nwInfo(nx);if(!ni)break;
        const k=ni.i.kind;
        if(ni.conn)conn=true;
        const ok=conn||k==='h'||k==='t'||k==='f'||(ni.i.v===10&&lastUnit);
        if(!ok)break;
        take(ni.i);j+=step
      }
      T.push({t:'num',v:total+cur});i=j;continue
    }
    if(pre)continue;
    if(OPMAP[w]){T.push({t:'op',o:OPMAP[w]});continue}
    if(BYW.has(w)){T.push({t:'by'});continue}
    if(UNITS.has(w)){T.push({t:'unit'});continue}
    T.push({t:'w'})
  }
  return T
}
function parseDictation(raw){
  const T=tokenize(raw),out=[];let cur=null;
  for(let i=0;i<T.length;i++){
    const k=T[i];
    if(k.t==='brk'){cur=null;continue}
    if(k.t==='num'){cur={p:[fmtN(k.v)],last:i};out.push(cur);continue}
    if(k.t==='op'||k.t==='by'){
      const o=k.t==='by'?'×':k.o;
      let j=i-1;if(j>=0&&T[j].t==='unit')j--;
      const prevNum=j>=0&&T[j].t==='num'&&cur&&cur.last===j;
      const nx=T[i+1];
      if(nx&&nx.t==='num'){
        if(prevNum){cur.p.push(o,fmtN(nx.v));cur.last=i+1;i++;continue}
        if(k.t==='op'&&o==='-'){cur={p:['-'+fmtN(nx.v)],last:i+1};out.push(cur);i++;continue}
      }
    }
  }
  return out.map(c=>c.p.join('')).filter(e=>typeof val(e)==='number')
}

const GM=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const HM=['محرم','صفر','ربيع الأول','ربيع الآخر','جمادى الأولى','جمادى الآخرة','رجب','شعبان','رمضان','شوال','ذو القعدة','ذو الحجة'];
const WDN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const HF=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'numeric',year:'numeric'});
const noon=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate(),12);
function g2h(d){const o={};HF.formatToParts(d).forEach(x=>{if(x.type==='day')o.d=+x.value;else if(x.type==='month')o.m=+x.value;else if(x.type==='year')o.y=+x.value});return o}
function h2g(y,m,d){
  const jd=d+Math.ceil(29.5*(m-1))+(y-1)*354+Math.floor((3+11*y)/30)+1948438.5;
  const u=new Date((jd-2440587.5)*864e5);
  const base=new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate(),12);
  for(const k of [0,-1,1,-2,2,-3,3]){const t=new Date(base.getFullYear(),base.getMonth(),base.getDate()+k,12);const h=g2h(t);if(h.y===y&&h.m===m&&h.d===d)return t}
  return null
}
const _hl={};
function hLen(y,m){const k=y*13+m;if(_hl[k])return _hl[k];const a=h2g(y,m,1),b=h2g(m===12?y+1:y,m===12?1:m+1,1);return _hl[k]=(a&&b)?Math.round((b-a)/864e5):30}
const fG=d=>d.getDate()+' '+GM[d.getMonth()]+' '+d.getFullYear()+'م';
const fH=d=>{const h=g2h(d);return h.d+' '+HM[h.m-1]+' '+h.y+'هـ'};
function dur(a,b,cal){
  let A,B;
  if(cal==='h'){A=g2h(a);B=g2h(b)}else{A={y:a.getFullYear(),m:a.getMonth()+1,d:a.getDate()};B={y:b.getFullYear(),m:b.getMonth()+1,d:b.getDate()}}
  let y=B.y-A.y,m=B.m-A.m,d=B.d-A.d;
  if(d<0){m--;const pm=B.m===1?12:B.m-1,py=B.m===1?B.y-1:B.y;d+=cal==='h'?hLen(py,pm):new Date(py,pm,0).getDate()}
  if(m<0){y--;m+=12}
  return {y,m,d}
}
function durText(o){
  const P=[];
  if(o.y)P.push(o.y===1?'سنة':o.y===2?'سنتان':o.y<=10?o.y+' سنوات':o.y+' سنة');
  if(o.m)P.push(o.m===1?'شهر':o.m===2?'شهران':o.m<=10?o.m+' أشهر':o.m+' شهرًا');
  if(o.d)P.push(o.d===1?'يوم':o.d===2?'يومان':o.d<=10?o.d+' أيام':o.d+' يومًا');
  return P.length?P.join(' و '):'أقل من يوم'
}
const nDays=(a,b)=>Math.round((b-a)/864e5);

/* عجلات اختيار التاريخ (هجري / ميلادي) */
function mkWheel(onchg){
  const el=document.createElement('div');el.className='whl';
  let n=0,t=null,quiet=false;
  const mark=i=>{[...el.children].forEach((c,k)=>c.classList.toggle('on',k===i))};
  el.addEventListener('scroll',()=>{
    if(quiet)return;
    const i=Math.max(0,Math.min(n-1,Math.round(el.scrollTop/42)));mark(i);
    clearTimeout(t);t=setTimeout(()=>onchg(i),110)
  });
  return {el,len:()=>n,set(items,i){
    quiet=true;n=items.length;el.innerHTML='';
    items.forEach((s,k)=>{const d=document.createElement('div');d.className='wi';d.textContent=s;d.onclick=()=>el.scrollTo({top:k*42,behavior:'smooth'});el.appendChild(d)});
    el.scrollTop=i*42;mark(i);setTimeout(()=>{quiet=false},160)
  }}
}
function openPicker(init){
  return new Promise(res=>{
    let cal='h';try{cal=localStorage.getItem('calc_cal')||'h'}catch(e){}
    let cur=noon(init||new Date());
    const ov=document.createElement('div');ov.className='dpv';
    const sh=document.createElement('div');sh.className='dps';
    const done=v=>{ov.remove();res(v)};
    ov.addEventListener('click',e=>{if(e.target===ov)done(null)});
    const F=()=>cal==='h'?g2h(cur):{y:cur.getFullYear(),m:cur.getMonth()+1,d:cur.getDate()};
    const len=(y,m)=>cal==='h'?hLen(y,m):new Date(y,m,0).getDate();
    const YR=()=>cal==='h'?[1318,1500]:[1900,2100];
    function setF(y,m,d){d=Math.min(d,len(y,m));if(cal==='h'){const g=h2g(y,m,d);if(g)cur=g}else cur=new Date(y,m-1,d,12)}
    const days=L=>Array.from({length:L},(_,i)=>String(i+1));
    const wd=mkWheel(i=>{const f=F();setF(f.y,f.m,i+1)});
    const wm=mkWheel(i=>{const f=F();setF(f.y,i+1,f.d);refreshDays()});
    const wy=mkWheel(i=>{const f=F();setF(YR()[0]+i,f.m,f.d);refreshDays()});
    function refreshDays(){const f=F(),L=len(f.y,f.m);if(wd.len()!==L)wd.set(days(L),f.d-1)}
    function fill(){const f=F(),[a,b]=YR();wd.set(days(len(f.y,f.m)),f.d-1);wm.set(cal==='h'?HM:GM,f.m-1);wy.set(Array.from({length:b-a+1},(_,i)=>String(a+i)),f.y-a)}
    const top=document.createElement('div');top.className='dph';
    const rad=(txt,k)=>{const l=document.createElement('label');const r=document.createElement('span');r.className='rd';l.append(r,txt);l.onclick=()=>{cal=k;try{localStorage.setItem('calc_cal',k)}catch(e){}sync();fill()};l._r=r;l._k=k;return l};
    const rh=rad('هجري','h'),rg=rad('ميلادي','g');
    const sync=()=>{[rh,rg].forEach(l=>l._r.classList.toggle('on',l._k===cal))};
    const td=document.createElement('button');td.textContent='اليوم';td.onclick=()=>{cur=noon(new Date());fill()};
    top.append(rh,rg,td);
    const w=document.createElement('div');w.className='dpw';w.append(wd.el,wm.el,wy.el);
    const bt=document.createElement('div');bt.className='dpb';
    const ok=document.createElement('button');ok.textContent='تم';ok.style.cssText='background:var(--acc);color:#fff';ok.onclick=()=>done(cur);
    const no=document.createElement('button');no.textContent='إلغاء';no.onclick=()=>done(null);
    bt.append(ok,no);
    sh.append(top,w,bt);ov.appendChild(sh);calcEl.appendChild(ov);
    sync();fill()
  })
}

/* ---------- تحويل العملات ---------- */
const CUR=[['SAR','ريال سعودي'],['USD','دولار أمريكي'],['EUR','يورو'],['GBP','جنيه إسترليني'],['AED','درهم إماراتي'],['KWD','دينار كويتي'],['QAR','ريال قطري'],['BHD','دينار بحريني'],['OMR','ريال عماني'],['EGP','جنيه مصري'],['JOD','دينار أردني'],['IQD','دينار عراقي'],['LBP','ليرة لبنانية'],['SYP','ليرة سورية'],['YER','ريال يمني'],['SDG','جنيه سوداني'],['LYD','دينار ليبي'],['TND','دينار تونسي'],['DZD','دينار جزائري'],['MAD','درهم مغربي'],['TRY','ليرة تركية'],['PKR','روبية باكستانية'],['INR','روبية هندية'],['BDT','تاكا بنغلاديشية'],['LKR','روبية سريلانكية'],['NPR','روبية نيبالية'],['PHP','بيزو فلبيني'],['IDR','روبية إندونيسية'],['MYR','رينغيت ماليزي'],['SGD','دولار سنغافوري'],['THB','بات تايلندي'],['VND','دونغ فيتنامي'],['CNY','يوان صيني'],['JPY','ين ياباني'],['KRW','وون كوري'],['HKD','دولار هونغ كونغ'],['CHF','فرنك سويسري'],['CAD','دولار كندي'],['AUD','دولار أسترالي'],['NZD','دولار نيوزيلندي'],['SEK','كرونة سويدية'],['NOK','كرونة نرويجية'],['DKK','كرونة دنماركية'],['PLN','زلوتي بولندي'],['CZK','كرونة تشيكية'],['RUB','روبل روسي'],['UAH','هريفنا أوكرانية'],['BRL','ريال برازيلي'],['MXN','بيزو مكسيكي'],['ARS','بيزو أرجنتيني'],['ZAR','راند جنوب أفريقي'],['ETB','بر إثيوبي'],['KES','شلن كيني'],['NGN','نايرا نيجيرية'],['GHS','سيدي غاني']];
const CURN={};CUR.forEach(c=>{CURN[c[0]]=c[1]});
async function fetchFx(){
  try{const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();if(j&&j.result==='success'&&j.rates)return {r:j.rates,u:(j.time_last_update_unix||0)*1000,s:'er'}}catch(e){}
  for(const url of ['https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json','https://latest.currency-api.pages.dev/v1/currencies/usd.min.json']){
    try{const r=await fetch(url);const j=await r.json();if(j&&j.usd){const o={};for(const k in j.usd)o[k.toUpperCase()]=j.usd[k];return {r:o,u:new Date(j.date+'T00:00:00Z').getTime(),s:'fa'}}}catch(e){}
  }
  return null
}
async function getFx(force){
  let c=null;try{c=JSON.parse(localStorage.getItem('calc_fx')||'null')}catch(e){}
  if(!force&&c&&c.r&&Date.now()-c.t<3600e3)return c;
  const n=await fetchFx();
  if(n){n.t=Date.now();try{localStorage.setItem('calc_fx',JSON.stringify(n))}catch(e){}return n}
  return c&&c.r?Object.assign({},c,{stale:true}):null
}
function fxNum(v){
  if(!isFinite(v))return '—';
  const a=Math.abs(v);
  if(a>=1)return v.toLocaleString('en',{maximumFractionDigits:2,minimumFractionDigits:2});
  if(a===0)return '0';
  return v.toLocaleString('en',{maximumSignificantDigits:4})
}
function fxRate(v){
  const a=Math.abs(v);
  return v.toLocaleString('en',a>=100?{maximumFractionDigits:2}:a>=1?{maximumFractionDigits:4}:{maximumSignificantDigits:5})
}
function fxAgo(ms){
  const m=Math.max(0,Math.round((Date.now()-ms)/6e4));
  if(m<2)return 'الآن';
  if(m<60)return 'قبل '+m+' دقيقة';
  const h=Math.round(m/60);if(h<24)return 'قبل '+(h===1?'ساعة':h===2?'ساعتين':h<=10?h+' ساعات':h+' ساعة');
  const d=Math.round(h/24);return 'قبل '+(d===1?'يوم':d===2?'يومين':d<=10?d+' أيام':d+' يومًا')
}
function fxTime(ms){
  const d=new Date(ms);
  return fG(d)+' - '+d.toLocaleTimeString('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'})
}
const arN=t=>t.toLowerCase().replace(/[ً-ٰٟـ]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');
function openCurPick(cur,list,done){
  const ov=document.createElement('div');ov.className='cpv';
  const close=v=>{ov.remove();if(v)done(v)};
  const h=document.createElement('div');h.className='cph';
  const q=document.createElement('input');q.type='text';q.placeholder='اكتب حرفًا أو اسم العملة';q.autocomplete='off';q.setAttribute('enterkeyhint','search');
  const x=document.createElement('button');x.className='bk';x.textContent='→ رجوع';x.onclick=()=>close(null);
  h.append(x,q);
  const L=document.createElement('div');L.className='cpl';
  const draw=()=>{
    const t=arN(q.value.trim());L.innerHTML='';
    list.filter(c=>{
      if(!t)return true;
      const nm=arN(c[1]);
      return nm.split(' ').some(w=>w.startsWith(t))||c[0].toLowerCase().startsWith(t)||(t.length>=3&&nm.includes(t))
    }).forEach(c=>{
      const r=document.createElement('div');r.className='cpi'+(c[0]===cur?' on':'');
      const n=document.createElement('div');n.textContent=c[1];const k=document.createElement('span');k.textContent=c[0];
      r.append(n,k);r.onclick=()=>close(c[0]);L.append(r)
    });
    if(!L.children.length){const e=document.createElement('div');e.className='note';e.style.cssText='padding:16px 4px;grid-column:1/-1';e.textContent='لا توجد نتيجة';L.append(e)}
  };
  q.oninput=draw;
  q.onkeydown=e=>{if(e.key==='Enter'){const f=L.querySelector('.cpi');if(f)f.click()}};
  ov.append(h,L);calcEl.appendChild(ov);draw();
  q.focus();q.select()
}
function openCur(){
  const {b}=overlay('تحويل العملات');
  let from='SAR',to='USD',amt='1',fx=null,busy=false,fail=false;
  try{from=localStorage.getItem('calc_fx_from')||from;to=localStorage.getItem('calc_fx_to')||to;amt=localStorage.getItem('calc_fx_amt')||amt}catch(e){}
  const save=()=>{try{localStorage.setItem('calc_fx_from',from);localStorage.setItem('calc_fx_to',to);localStorage.setItem('calc_fx_amt',amt)}catch(e){}};
  const lb=t=>{const d=document.createElement('div');d.className='fxlb';d.textContent=t;return d};
  const inp=document.createElement('input');inp.className='nm fxa';inp.type='text';inp.inputMode='decimal';inp.autocomplete='off';inp.value=amt;
  const selAll=()=>{try{inp.select();inp.setSelectionRange(0,inp.value.length)}catch(e){}};
  inp.onfocus=()=>{selAll();setTimeout(selAll,30)};
  inp.onpointerup=()=>setTimeout(selAll,0);
  inp.onclick=()=>setTimeout(selAll,0);
  inp.oninput=()=>{
    let v=inp.value.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫,،]/g,'.').replace(/[^0-9.]/g,'');
    const i=v.indexOf('.');if(i>=0)v=v.slice(0,i+1)+v.slice(i+1).replace(/\./g,'');
    if(v!==inp.value)inp.value=v;amt=v;save();render()
  };
  const fb=document.createElement('div'),swap=document.createElement('button'),tb=document.createElement('div'),rb=document.createElement('div');
  swap.className='fxs';swap.textContent='⇅';swap.setAttribute('aria-label','تبديل');
  swap.onclick=()=>{const t=from;from=to;to=t;save();render()};
  const list=()=>fx?CUR.filter(c=>fx.r[c[0]]):CUR;
  const field=(label,get,set)=>{
    const f=document.createElement('button');f.className='df';
    const l=document.createElement('span');l.textContent=label;
    const v=document.createElement('b');v.textContent=(CURN[get()]||get())+'  ('+get()+')';
    f.append(l,v);
    f.onclick=()=>openCurPick(get(),list(),x=>{set(x);save();render()});
    return f
  };
  function render(){
    fb.innerHTML='';tb.innerHTML='';rb.innerHTML='';
    fb.append(field('من',()=>from,x=>{from=x}));
    tb.append(field('إلى',()=>to,x=>{to=x}));
    if(!fx){
      const p=document.createElement('p');p.className='note';
      p.textContent=busy?'جارٍ جلب الأسعار...':fail?'تعذّر جلب الأسعار. تأكد من الإنترنت ثم اضغط «تحديث الأسعار».':'';
      rb.append(p);return
    }
    const rf=fx.r[from],rt=fx.r[to];
    if(!rf||!rt){const p=document.createElement('p');p.className='note';p.textContent='هذه العملة غير متوفرة حاليًا.';rb.append(p);return}
    const rate=rt/rf,n=parseFloat(amt);
    const c=document.createElement('div');c.className='fxres';
    const ln=(t,cls)=>{const d=document.createElement('div');d.className=cls;d.textContent=t;c.append(d)};
    ln(isFinite(n)?fxNum(n*rate)+' '+(CURN[to]||to):'أدخل المبلغ','big');
    ln('1 '+from+' = '+fxRate(rate)+' '+to+'   |   1 '+to+' = '+fxRate(1/rate)+' '+from,'sm ltr');
    ln((fx.s==='er'?'آخر تحديث للأسعار: '+fxTime(fx.u):'تاريخ الأسعار: '+fG(new Date(fx.u))),'sm');
    if(fx.stale){const w=document.createElement('div');w.className='fxw2';w.textContent='⚠ لا يوجد إنترنت الآن. هذه آخر أسعار محفوظة، جُلبت '+fxAgo(fx.t)+' ('+fxTime(fx.t)+'). شغّل الإنترنت واضغط «تحديث» لتحصل على الأسعار الجديدة.';c.append(w)}
    rb.append(c)
  }
  const rf=document.createElement('button');rf.textContent='تحديث';rf.style.cssText='font-size:14px;padding:7px 12px;width:auto';rf.onclick=()=>load(true);
  b.parentNode.querySelector('.ovh').append(rf);
  async function load(force){
    busy=true;fail=false;render();
    const r=await getFx(force);
    busy=false;
    if(r){fx=r;if(!list().some(c=>c[0]===from))from='SAR';if(!list().some(c=>c[0]===to))to='USD'}else fail=!fx;
    render()
  }
  const note=document.createElement('div');note.className='fxn';
  note.append('أسعار مرجعية تُحدَّث مرة في اليوم، وقد تختلف عن أسعار البنوك ومحلات الصرافة. المصدر: ');
  const a=document.createElement('a');a.href='https://www.exchangerate-api.com';a.target='_blank';a.rel='noopener';a.textContent='ExchangeRate-API';note.append(a,' (وبديله Currency-API).');
  const fw=document.createElement('div');fw.className='fxw';fw.append(fb,tb,swap);
  inp.placeholder='المبلغ';b.append(inp,fw,rb,note);
  render();load(false)
}
function infoText(title,name,rows){
  const o=[title];if(name)o.push('الاسم: '+name);o.push('');
  rows.forEach(r=>o.push(r.l+': '+r.v.join(' / ')));
  return o.join('\n')
}
function makeInfoPNG(title,name,rows){
  const W=720,pad=40,F='system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif';
  const headH=name?150:110,cellH=r=>18+30+r.v.length*42+10;
  const H=headH+rows.reduce((a,r)=>a+cellH(r),0)+50;
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.fillStyle='#fafafb';x.fillRect(0,0,W,H);x.textBaseline='middle';
  x.direction='rtl';x.textAlign='center';x.fillStyle='#111';x.font='bold 42px '+F;x.fillText(title,W/2,48);
  if(name){x.fillStyle='#333';x.font='600 31px '+F;x.fillText(name,W/2,100,W-2*pad)}
  x.strokeStyle='#d3d8df';x.lineWidth=2;
  const sideS=RTL?W-pad:pad;let y=headH;
  x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();
  rows.forEach(r=>{
    x.direction='rtl';x.textAlign=RTL?'right':'left';
    x.fillStyle='#6b7280';x.font='600 24px '+F;x.fillText(r.l,sideS,y+30);
    x.fillStyle='#111';x.font='bold 31px '+F;
    r.v.forEach((t,k)=>x.fillText(t,sideS,y+30+14+(k+1)*42-14,W-2*pad));
    y+=cellH(r);x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()
  });
  return c
}
